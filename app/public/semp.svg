<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B6B3F"/>
      <stop offset="1" stop-color="#073D24"/>
    </linearGradient>
  </defs>

  <style>
    .bg   { fill: url(#bgGrad); }
    .leaf { fill: #00E0B8; }

    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0E140F; }
      .leaf { fill: #17E58A; }
    }
  </style>

  <!-- Rounded canvas with subtle depth gradient -->
  <rect class="bg" width="32" height="32" rx="7"/>

  <!-- Leaf silhouette (sustainability) with a bolt-shaped vein cut out of it (energy) -->
  <path class="leaf" fill-rule="evenodd"
        d="M16 7 C22 10 25 16 16 25 C7 16 10 10 16 7 Z
           M17 10 L13.5 17 L16 17 L14.5 22 L19 15 L16.5 15 Z"/>
</svg>